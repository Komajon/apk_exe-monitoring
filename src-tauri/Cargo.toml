[package]
name = "ap-babilon-monitor"
version = "1.0.0"
description = "Мониторинг AP_Babilon-T"
edition = "2021"

[lib]
name = "ap_babilon_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt", "macros", "net", "sync"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
tauri-plugin-opener = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
